name: Refresh bibliometrics

on:
  schedule:
    # Mondays, 05:10 UTC. GitHub may delay scheduled runs under load.
    - cron: "10 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-bibliometrics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate data/profile.json
        # Sin el secreto WOS_API_KEY la variable llega vacia y el script
        # mantiene las cifras de Web of Science escritas a mano en
        # data/content.json, sin fallar.
        run: python3 scripts/update_data.py
        env:
          WOS_API_KEY: ${{ secrets.WOS_API_KEY }}

      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain data/profile.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/profile.json
            git commit -m "data: refresh bibliometrics ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No change in data/profile.json."
          fi
