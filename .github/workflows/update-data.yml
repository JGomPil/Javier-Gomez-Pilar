name: Refresh bibliometrics

on:
  schedule:
    # Mondays, 05:10 UTC. GitHub may delay scheduled runs under load.
    - cron: "10 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write     # para abrir un aviso si la ejecucion falla

concurrency:
  group: refresh-bibliometrics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate data/profile.json
        # Sin el secreto WOS_API_KEY la variable llega vacia y el script
        # mantiene las cifras de Web of Science escritas a mano en
        # data/content.json, sin fallar.
        run: python3 scripts/update_data.py
        env:
          WOS_API_KEY: ${{ secrets.WOS_API_KEY }}

      - name: Write the static summary into index.html
        # Lo que leen los buscadores y lectores que no ejecutan JS. Si
        # los datos no han cambiado, deja index.html igual.
        run: python3 scripts/prerender.py

      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain data/profile.json index.html)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/profile.json index.html
            git commit -m "data: refresh bibliometrics ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No change in data/profile.json or index.html."
          fi

      - name: Warn if the Portal has not answered for a month
        # El Portal de la Ciencia corta casi siempre las conexiones que
        # vienen de GitHub. El script no falla por eso: hereda los
        # proyectos. Pero si pasa mucho tiempo, los proyectos se quedan
        # viejos sin que nadie se entere. Aqui se mira cuando contesto
        # entero por ultima vez (portal_checked en profile.json) y, a
        # partir de 30 dias, se abre un aviso; cuando vuelve a estar al
        # dia, el aviso se cierra solo.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="Los proyectos del Portal llevan más de un mes sin actualizarse"
          # Cualquier cosa rara (sin fecha, fecha mal escrita) cuenta
          # como vieja: mejor un aviso de mas que uno de menos.
          DIAS=$(python3 -c "
          import json, datetime
          try:
              d = json.load(open('data/profile.json'))['portal_checked']
              print((datetime.date.today() - datetime.date.fromisoformat(d)).days)
          except Exception:
              print(999)
          ")
          echo "Ultima lectura completa del Portal: hace $DIAS dias."
          NUM=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number -q '.[0].number')
          if [ "$DIAS" -gt 30 ]; then
            BODY="El Portal de la Ciencia no contesta desde GitHub y los proyectos de la web llevan $DIAS días sin refrescarse. Desde un ordenador de casa o de la UVa sí contesta:

          \`\`\`sh
          cd ~/PersonalWeb
          git pull
          python3 scripts/update_data.py
          python3 scripts/prerender.py
          git add data/profile.json index.html
          git commit -m \"data: proyectos del Portal, regenerado en local\"
          git push
          \`\`\`

          Este issue se cierra solo en la siguiente ejecución del cron después de eso."
            if [ -z "$NUM" ]; then
              gh issue create --title "$TITLE" --body "$BODY"
            fi
          elif [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "Los proyectos vuelven a estar al día (última lectura del Portal hace $DIAS días)."
          fi

      - name: Open an issue if the run failed
        # Una ejecucion en rojo no avisa a nadie; un issue nuevo si, por
        # correo. Si ya hay uno abierto, se comenta en el en lugar de
        # abrir otro cada lunes.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="El refresco de los lunes ha fallado"
          BODY="La ejecucion de $(date -u +%Y-%m-%d) termino en rojo: $RUN_URL

          Lo mas probable es que el script se haya negado a escribir porque alguna cifra se desplomaba o una fuente cambio su HTML (ver «Regenerar los datos a mano» en el README). La web sigue con los ultimos datos buenos. Cierra este issue cuando este resuelto."
          NUM=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number -q '.[0].number')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
